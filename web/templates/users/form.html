{% extends "layouts/base.html" %}
{% block title %}{{ 'تعديل مستخدم' if user else 'إضافة مستخدم' }} | امارات ليبيا{% endblock %}
{% block content %}
<div class="page-header mb-4">
  <h4 class="page-title">{{ 'تعديل بيانات المستخدم' if user else 'إضافة مستخدم جديد' }}</h4>
</div>

<div class="card">
  <div class="card-body">
    <form method="POST">
      <div class="row g-3">
        {% if not user %}
        <div class="col-md-4">
          <label class="form-label">اسم المستخدم <span class="text-danger">*</span></label>
          <input type="text" name="username" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">كلمة المرور <span class="text-danger">*</span></label>
          <input type="password" name="password" class="form-control" required minlength="6">
        </div>
        {% endif %}
        <div class="col-md-4">
          <label class="form-label">الاسم الكامل بالعربي <span class="text-danger">*</span></label>
          <input type="text" name="full_name_ar" class="form-control" value="{{ user.full_name_ar if user else '' }}" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">الاسم بالإنجليزي</label>
          <input type="text" name="full_name_en" class="form-control" value="{{ user.full_name_en if user and user.full_name_en else '' }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">البريد الإلكتروني</label>
          <input type="email" name="email" class="form-control" value="{{ user.email if user and user.email else '' }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">الهاتف</label>
          <input type="text" name="phone" class="form-control" value="{{ user.phone if user and user.phone else '' }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">الدور</label>
          <select name="role_id" class="form-select">
            <option value="">اختر الدور</option>
            {% for role in roles %}
            <option value="{{ role.id }}" {% if user and user.role_id == role.id %}selected{% endif %}>{{ role.name_ar }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">القسم</label>
          <select name="department_id" class="form-select">
            <option value="">اختر القسم</option>
            {% for dept in departments %}
            <option value="{{ dept.id }}" {% if user and user.department_id == dept.id %}selected{% endif %}>{{ dept.name_ar }}</option>
            {% endfor %}
          </select>
        </div>
        {% if user %}
        <div class="col-md-4">
          <label class="form-label">كلمة المرور الجديدة (اتركها فارغة لعدم التغيير)</label>
          <input type="password" name="new_password" class="form-control" minlength="6">
        </div>
        {% endif %}
      </div>
      <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>{{ 'حفظ التعديلات' if user else 'إضافة المستخدم' }}</button>
        <a href="{{ url_for('users.users_list') }}" class="btn btn-outline-secondary">إلغاء</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
