{% extends "layouts/base.html" %}
{% block title %}إنشاء مراسلة | امارات ليبيا{% endblock %}
{% block content %}
<div class="page-header mb-4">
  <h4 class="page-title">إنشاء مراسلة جديدة</h4>
</div>

<div class="card">
  <div class="card-body">
    <form method="POST">
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">نوع المراسلة <span class="text-danger">*</span></label>
          <select name="type_code" class="form-select" required>
            <option value="">اختر النوع</option>
            {% for ct in cor_types %}
            <option value="{{ ct.code }}">{{ ct.name_ar }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">الاتجاه <span class="text-danger">*</span></label>
          <select name="direction" class="form-select" required>
            <option value="IN">وارد</option>
            <option value="OUT">صادار</option>
            <option value="INT">داخلي</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">الأهمية</label>
          <select name="importance" class="form-select">
            <option value="normal">عادي</option>
            <option value="high">مهم</option>
            <option value="critical">عاجل</option>
          </select>
        </div>
        <div class="col-md-12">
          <label class="form-label">الموضوع <span class="text-danger">*</span></label>
          <input type="text" name="subject" class="form-control" required placeholder="موضوع المراسلة">
        </div>
        <div class="col-md-12">
          <label class="form-label">المحتوى</label>
          <textarea name="body" class="form-control" rows="5" placeholder="نص المراسلة"></textarea>
        </div>
        <div class="col-md-4">
          <label class="form-label">القسم المرسل</label>
          <select name="sender_department_id" class="form-select">
            <option value="">اختر</option>
            {% for dept in departments %}
            <option value="{{ dept.id }}">{{ dept.name_ar }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">القسم المستلم</label>
          <select name="receiver_department_id" class="form-select">
            <option value="">اختر</option>
            {% for dept in departments %}
            <option value="{{ dept.id }}">{{ dept.name_ar }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">الموظف المسؤول</label>
          <select name="responsible_employee_id" class="form-select">
            <option value="">اختر</option>
            {% for emp in employees %}
            <option value="{{ emp.id }}">{{ emp.full_name_ar }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">الجهة المرسلة</label>
          <input type="text" name="sender_entity" class="form-control" placeholder="اسم الجهة المرسلة">
        </div>
        <div class="col-md-4">
          <label class="form-label">الجهة المستلمة</label>
          <input type="text" name="receiver_entity" class="form-control" placeholder="اسم الجهة المستلمة">
        </div>
        <div class="col-md-4">
          <label class="form-label">تاريخ الاستحقاق</label>
          <input type="date" name="due_date" class="form-control">
        </div>
        <div class="col-md-4">
          <label class="form-label">السائق</label>
          <select name="driver_id" class="form-select">
            <option value="">اختر</option>
            {% for drv in drivers %}
            <option value="{{ drv.id }}">{{ drv.full_name_ar }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">العميل</label>
          <select name="customer_id" class="form-select">
            <option value="">اختر</option>
            {% for cust in customers %}
            <option value="{{ cust.id }}">{{ cust.name_ar }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <div class="form-check mt-4">
            <input class="form-check-input" type="checkbox" name="is_confidential" id="is_confidential">
            <label class="form-check-label" for="is_confidential">سري</label>
          </div>
        </div>
        <div class="col-md-12">
          <label class="form-label">ملاحظات</label>
          <textarea name="notes" class="form-control" rows="2"></textarea>
        </div>
      </div>
      <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>إنشاء المراسلة</button>
        <a href="{{ url_for('correspondence.correspondence_list') }}" class="btn btn-outline-secondary">إلغاء</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
