<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | امارات ليبيا</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">

  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-body);
      position: relative;
      overflow: hidden;
    }

    .login-wrapper::before {
      content: '';
      position: absolute;
      top: -40%;
      right: -20%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(59,130,246,0.06) 0%, transparent 70%);
      border-radius: 50%;
    }

    .login-wrapper::after {
      content: '';
      position: absolute;
      bottom: -30%;
      left: -15%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(6,182,212,0.05) 0%, transparent 70%);
      border-radius: 50%;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 40px 36px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.4);
      position: relative;
      z-index: 1;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo .logo-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #fff;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(59,130,246,0.25);
    }

    .login-logo h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      margin: 0 0 4px;
    }

    .login-logo p {
      font-size: 13px;
      color: var(--text-muted);
      margin: 0;
    }

    .login-card .form-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .input-group {
      position: relative;
    }

    .input-group .input-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 16px;
      z-index: 4;
      pointer-events: none;
    }

    .input-group .form-control {
      padding-right: 42px;
    }

    .login-remember {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .login-remember label {
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .login-remember a {
      font-size: 13px;
      color: var(--accent-blue);
    }

    .btn-login {
      width: 100%;
      padding: 11px;
      font-size: 15px;
      font-weight: 600;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--accent-blue), #2563eb);
      border: none;
      color: #fff;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-login:hover {
      box-shadow: 0 6px 20px rgba(59,130,246,0.35);
      transform: translateY(-1px);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .login-footer {
      text-align: center;
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-icon">
          <i class="bi bi-building"></i>
        </div>
        <h1>امارات ليبيا</h1>
        <p>نظام إدارة الموارد البشرية</p>
      </div>

      <!-- Flash Messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} mb-3" role="alert" style="font-size:13px;">
              <i class="bi {% if category == 'success' %}bi-check-circle-fill{% elif category == 'danger' %}bi-x-circle-fill{% elif category == 'warning' %}bi-exclamation-triangle-fill{% else %}bi-info-circle-fill{% endif %}"></i>
              {{ message }}
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('auth.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="mb-3">
          <label class="form-label">اسم المستخدم</label>
          <div class="input-group">
            <i class="bi bi-person input-icon"></i>
            <input type="text"
                   name="username"
                   class="form-control"
                   placeholder="أدخل اسم المستخدم"
                   required
                   autofocus
                   autocomplete="username">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">كلمة المرور</label>
          <div class="input-group">
            <i class="bi bi-lock input-icon"></i>
            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="أدخل كلمة المرور"
                   required
                   autocomplete="current-password">
          </div>
        </div>

        <div class="login-remember">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="remember" id="remember">
            <label class="form-check-label" for="remember">تذكرني</label>
          </div>
          <a href="#">نسيت كلمة المرور؟</a>
        </div>

        <button type="submit" class="btn btn-login">
          <i class="bi bi-box-arrow-in-left me-2"></i>
          تسجيل الدخول
        </button>
      </form>

      <div class="login-footer">
        &copy; {{ "2026" }} امارات ليبيا. جميع الحقوق محفوظة.
      </div>
    </div>
  </div>
</body>
</html>
