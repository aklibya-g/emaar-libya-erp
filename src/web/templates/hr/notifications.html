{% extends "layouts/base.html" %}
{% block title %}الإشعارات | شركة اعمار ليبيا لنقل الركاب{% endblock %}
{% block content %}
<div class="page-header d-flex justify-content-between align-items-center mb-4">
  <h4 class="page-title"><i class="bi bi-bell me-2"></i>الإشعارات</h4>
  <a href="{{ url_for('hr.hr_dashboard') }}" class="back-btn-header">
    <i class="bi bi-arrow-right"></i> لوحة التحكم
  </a>
</div>

<div class="card">
  <div class="card-body p-0">
    {% if notifications %}
    <div class="list-group list-group-flush">
      {% for n in notifications %}
      <form method="POST" action="{{ url_for('hr.notification_read', id=n.id) }}" class="list-group-item list-group-item-action {{ 'bg-primary bg-opacity-10 border-primary' if not n.is_read else '' }}" style="cursor:pointer;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="btn btn-link text-decoration-none text-start w-100 p-0" style="background:none;border:none;">
          <div class="d-flex justify-content-between align-items-start">
            <div class="flex-grow-1">
              <div class="d-flex align-items-center mb-1">
                {% if not n.is_read %}
                <span class="badge bg-primary rounded-pill me-2" style="font-size:8px;padding:3px 6px;">جديد</span>
                {% endif %}
                {% if n.notification_type == 'leave_pending_executive' %}
                <i class="bi bi-calendar2-check text-success me-2" style="font-size:18px"></i>
                {% elif n.notification_type == 'leave_approved' %}
                <i class="bi bi-check-circle text-success me-2" style="font-size:18px"></i>
                {% elif n.notification_type == 'leave_rejected' %}
                <i class="bi bi-x-circle text-danger me-2" style="font-size:18px"></i>
                {% elif n.notification_type == 'finance_claim_pending' %}
                <i class="bi bi-wallet2 text-warning me-2" style="font-size:18px"></i>
                {% else %}
                <i class="bi bi-info-circle text-info me-2" style="font-size:18px"></i>
                {% endif %}
                <span class="fw-bold {{ 'text-primary' if not n.is_read else 'text-dark' }}">{{ n.title }}</span>
              </div>
              {% if n.message %}
              <p class="mb-1 text-muted small" style="line-height:1.6">{{ n.message }}</p>
              {% endif %}
            </div>
            <small class="text-muted text-nowrap me-3" style="white-space:nowrap">
              {% if n.created_at %}
                {{ n.created_at.strftime('%Y-%m-%d %H:%M') }}
              {% endif %}
            </small>
          </div>
        </button>
      </form>
      {% endfor %}
    </div>
    {% else %}
    <div class="text-center py-5">
      <i class="bi bi-bell-slash text-muted" style="font-size:48px"></i>
      <p class="text-muted mt-3">لا توجد إشعارات</p>
    </div>
    {% endif %}
  </div>
</div>
{% endblock %}
