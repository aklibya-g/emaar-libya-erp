services:
  - type: web
    name: emaar-libya-erp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: emaar-erp-db
          property: connectionString
      - key: APP_DEBUG
        value: "false"
    healthCheckPath: /dashboard

databases:
  - name: emaar-erp-db
    plan: free
    databaseName: emaar_erp
